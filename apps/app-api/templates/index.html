
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>API Message - ID 589</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: #0f172a;
            color: white;
            padding: 20px;
        }

        .message-card {
            width: 100%;
            max-width: 1000px;
            padding: 60px 30px;
            text-align: center;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,.3);
        }

        .tag {
            color: #38bdf8;
            letter-spacing: 3px;
            font-size: 14px;
            font-weight: bold;
        }

        h1 {
            font-size: clamp(35px, 8vw, 80px);
            overflow-wrap: anywhere;
            margin: 35px 0;
            color: #38bdf8;
        }

        .student {
            color: #94a3b8;
        }

        a {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 25px;
            background: #0284c7;
            color: white;
            text-decoration: none;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <div class="message-card">

        <div class="tag">
            KUBERNETES API SERVICE
        </div>

        <h1>{{ message }}</h1>

        <p class="student">
            Panyapat Sungrung | Student ID: 589
        </p>

        <a href="/">
            API Home
        </a>

    </div>

</body>
</html>
