
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | Edit Research</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 35px 20px;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: #0b1120;
            color: #f8fafc;
        }

        .container {
            max-width: 950px;
            margin: auto;
            background: #162238;
            border: 1px solid #334155;
            padding: 35px;
            border-radius: 18px;
        }

        .tag {
            color: #a78bfa;
            font-weight: bold;
            letter-spacing: 2px;
            font-size: 12px;
        }

        h1 {
            margin-bottom: 10px;
        }

        .description {
            color: #94a3b8;
            line-height: 1.7;
        }

        label {
            display: block;
            margin: 25px 0 10px;
            font-weight: bold;
        }

        textarea {
            display: block;
            width: 100%;
            min-height: 500px;
            padding: 18px;
            border: 1px solid #475569;
            border-radius: 10px;
            background: #0f172a;
            color: #f8fafc;
            font-family: inherit;
            font-size: 15px;
            line-height: 1.8;
            resize: vertical;
        }

        textarea:focus {
            outline: 2px solid #8b5cf6;
        }

        .actions {
            display: flex;
            gap: 12px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        button, .back {
            border: none;
            padding: 13px 24px;
            border-radius: 9px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
        }

        button {
            background: #7c3aed;
            color: white;
        }

        .back {
            background: #334155;
            color: white;
        }

        footer {
            text-align: center;
            color: #64748b;
            margin-top: 25px;
            font-size: 13px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="tag">ADMINISTRATION PANEL</div>

    <h1>Edit Research Summary</h1>

    <p class="description">
        Student ID: 589 | Panyapat Sungrung
        <br>
        แก้ไขข้อมูลสรุปงานวิจัยและกด Save Research
        เพื่อบันทึกข้อมูล
    </p>

    <form method="POST" action="/edit">

        <label for="content">
            Research Content
        </label>

        <textarea
            id="content"
            name="content"
            required>{{ content }}</textarea>

        <div class="actions">
            <button type="submit">
                Save Research
            </button>

            <a href="http://www.id-589.com/" class="back">
                Cancel
            </a>
        </div>

    </form>

    <footer>
        Kubernetes Research Management · ID 589
    </footer>

</div>

</body>
</html>
