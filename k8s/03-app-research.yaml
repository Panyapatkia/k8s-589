apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-research
  namespace: id-589
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app-research
  template:
    metadata:
      labels:
        app: app-research
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-worker1
      containers:
        - name: app-research
          image: localhost/app-research:589
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
          volumeMounts:
            - name: research-data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /research
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /research
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: research-data
          persistentVolumeClaim:
            claimName: research-pvc-589
---
apiVersion: v1
kind: Service
metadata:
  name: svc-research
  namespace: id-589
spec:
  type: ClusterIP
  selector:
    app: app-research
  ports:
    - name: http
      port: 80
      targetPort: 5000
      protocol: TCP
