  about-index.html: |
    <!doctype html>
    <html lang="th">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>About | Panyapat</title>
    <style>
    *{box-sizing:border-box}
    body{margin:0;background:#080d18;color:#edf4ff;font:16px/1.7 Inter,"Noto Sans Thai",system-ui}
    .wrap{width:min(900px,92%);margin:55px auto}
    .card{margin-top:25px;padding:30px;background:#101a2b;border:1px solid #24334b;border-radius:22px;display:grid;grid-template-columns:260px 1fr;gap:30px;align-items:center}
    .photo{width:100%;border-radius:16px;aspect-ratio:1;object-fit:cover}
    .muted{color:#9aabc2}h1{font-size:36px;line-height:1.2}
    .pill{display:inline-block;padding:6px 12px;border:1px solid #35506d;border-radius:99px;color:#b8d8f7;margin:5px}
    @media(max-width:650px){.card{grid-template-columns:1fr}.photo{max-width:260px}}
    </style>
    </head>
    <body>
    <main class="wrap">

    <style>
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 9px 18px 9px 9px;
      margin-bottom: 8px;
      color: #dbeafe;
      text-decoration: none;
      background: #111d30;
      border: 1px solid #293f5c;
      border-radius: 50px;
      font-size: 14px;
      font-weight: 600;
      transition: all .25s ease;
    }
    .back-link:hover {
      background: #1b3452;
      border-color: #38bdf8;
      transform: translateX(-3px);
      color: #67e8f9;
    }
    .back-icon {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      background: #1e3552;
      border-radius: 50%;
      color: #67e8f9;
      font-size: 18px;
    }
    .back-text {
      display: flex;
      flex-direction: column;
      line-height: 1.35;
    }
    .back-text small {
      color: #8296b1;
      font-size: 10px;
      font-weight: 400;
    }
    </style>
    <a class="back-link" href="/">
      <span class="back-icon">←</span>
      <span class="back-text">
        Back to Dashboard
        <small>Return to Home</small>
      </span>
    </a>

    <section class="card">
    <img class="photo" src="/about/profile.png" alt="รูปนักศึกษา">
    <div>
    <div class="muted">ABOUT THE STUDENT</div>
    <h1>Panyapat Sungrung</h1>
    <p class="muted">นักศึกษาวิศวกรรมคอมพิวเตอร์ ผู้สนใจเทคโนโลยี Cloud Infrastructure, Virtualization, Kubernetes และระบบจัดเก็บข้อมูล</p>
    <span class="pill">Student ID: 68130589</span>
    <span class="pill">Computer Engineering</span>
    <span class="pill">Kubernetes Assignment</span>
    </div>
    </section>
    </main>
    </body>
    </html>
  index.html: |
    <!DOCTYPE html>
    <html lang="th">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PANYAPAT | Kubernetes Portal</title>
    <style>
    :root {
      --bg: #070b16;
      --panel: rgba(16, 27, 49, .78);
      --line: rgba(100, 160, 220, .19);
      --cyan: #35e0ff;
      --blue: #5685ff;
      --purple: #a477ff;
      --text: #edf5ff;
      --muted: #8295b5;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font-family: Inter, "Noto Sans Thai", Arial, sans-serif;
      background:
        radial-gradient(ellipse at 12% 5%, rgba(35,100,210,.19), transparent 34%),
        radial-gradient(ellipse at 90% 25%, rgba(113,65,220,.13), transparent 32%),
        var(--bg);
      overflow-x: hidden;
    }
    body:before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .22;
      background-image:
        linear-gradient(rgba(89,139,205,.10) 1px, transparent 1px),
        linear-gradient(90deg, rgba(89,139,205,.10) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: linear-gradient(to bottom, black, transparent 90%);
    }
    .container {
      width: min(1120px, 91%);
      margin: auto;
      position: relative;
    }
    nav {
      height: 82px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
    }
    .logo {
      font-size: 21px;
      font-weight: 900;
      letter-spacing: 2px;
    }
    .logo span { color: var(--cyan); }
    .nav-right {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--muted);
      font-size: 12px;
    }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 13px;
      border: 1px solid rgba(52,211,153,.25);
      background: rgba(16,185,129,.07);
      color: #6ee7b7;
      border-radius: 30px;
    }
    .dot {
      width: 7px;
      height: 7px;
      background: #34d399;
      border-radius: 50%;
      box-shadow: 0 0 12px #34d399;
    }
    .hero { padding: 66px 0 35px; }
    .eyebrow {
      color: var(--cyan);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 3px;
    }
    .hero h1 {
      margin: 16px 0 10px;
      font-size: clamp(34px, 5vw, 52px);
      line-height: 1.15;
      letter-spacing: -1.5px;
    }
    .gradient {
      background: linear-gradient(100deg, #fff 5%, #64b5ff 48%, #a78bfa 95%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .subtitle {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.8;
    }
    .hero-line {
      width: 75px;
      height: 3px;
      margin-top: 25px;
      border-radius: 5px;
      background: linear-gradient(90deg, var(--cyan), var(--purple));
      box-shadow: 0 0 16px rgba(53,224,255,.5);
    }
    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 32px 0 17px;
    }
    .section-head h2 {
      font-size: 16px;
      margin: 0;
      letter-spacing: .5px;
    }
    .section-head span {
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 1px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 17px;
    }
    .card {
      min-height: 158px;
      position: relative;
      display: flex;
      align-items: center;
      gap: 21px;
      padding: 25px;
      color: var(--text);
      text-decoration: none;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: linear-gradient(135deg, rgba(20,36,62,.92), rgba(12,21,39,.94));
      overflow: hidden;
      transition: transform .25s ease, border-color .25s ease, box-shadow .25s ease;
    }
    .card:before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 3px;
      height: 100%;
      background: linear-gradient(var(--cyan), var(--purple));
      opacity: .75;
    }
    .card:after {
      content: "";
      position: absolute;
      width: 180px;
      height: 180px;
      right: -100px;
      bottom: -120px;
      border-radius: 50%;
      background: var(--glow);
      filter: blur(55px);
      opacity: .13;
      transition: opacity .25s;
    }
    .card:hover {
      transform: translateY(-5px);
      border-color: var(--accent);
      box-shadow: 0 12px 35px rgba(0,0,0,.25), 0 0 22px var(--shadow);
    }
    .card:hover:after { opacity: .45; }
    .icon-box {
      flex-shrink: 0;
      width: 58px;
      height: 58px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      color: var(--accent);
      background: var(--icon-bg);
      border: 1px solid var(--icon-border);
    }
    .icon-box svg {
      width: 27px;
      height: 27px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .info { position: relative; z-index: 1; flex: 1; }
    .info h3 {
      margin: 0 0 6px;
      font-size: 18px;
      font-weight: 750;
    }
    .info p {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.7;
    }
    .path {
      display: block;
      margin-top: 10px;
      color: var(--accent);
      font-size: 11px;
      font-weight: 650;
    }
    .arrow {
      color: #7185a5;
      font-size: 21px;
      transition: .2s;
    }
    .card:hover .arrow {
      color: var(--accent);
      transform: translate(3px,-3px);
    }
    .about {--accent:#43d9ff;--glow:#18cfff;--shadow:rgba(24,207,255,.18);--icon-bg:rgba(24,207,255,.09);--icon-border:rgba(24,207,255,.2)}
    .research {--accent:#a78bfa;--glow:#9365ff;--shadow:rgba(147,101,255,.18);--icon-bg:rgba(167,139,250,.09);--icon-border:rgba(167,139,250,.2)}
    .api {--accent:#60a5fa;--glow:#3b82f6;--shadow:rgba(59,130,246,.18);--icon-bg:rgba(96,165,250,.09);--icon-border:rgba(96,165,250,.2)}
    .admin {--accent:#34d399;--glow:#10b981;--shadow:rgba(16,185,129,.18);--icon-bg:rgba(52,211,153,.09);--icon-border:rgba(52,211,153,.2)}
    .bottom-info {
      margin-top: 55px;
      padding: 20px 0;
      border-top: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      gap: 15px;
      color: #7185a5;
      font-size: 11px;
    }
    .bottom-info strong { color: #a9bdd9; font-weight: 600; }
    @media(max-width:650px) {
      .container { width: 92%; }
      nav { height: 70px; }
      .nav-right { font-size: 10px; }
      .hero { padding: 48px 0 25px; }
      .grid { grid-template-columns: 1fr; gap: 12px; }
      .card { min-height: 135px; padding: 19px; gap: 15px; }
      .icon-box { width: 50px; height: 50px; }
      .bottom-info { flex-direction: column; }
    }
    </style>
    </head>
    <body>
    <div class="container">
    <nav>
      <div class="logo">PANYAPAT<span>.</span></div>
      <div class="nav-right">
        <div class="status"><span class="dot"></span> PLATFORM ONLINE</div>
        <span>STUDENT ID · 68130589</span>
      </div>
    </nav>

    <header class="hero">
      <div class="eyebrow">KUBERNETES APPLICATION PLATFORM / 2026</div>
      <h1><span class="gradient">Service Dashboard</span></h1>
      <p class="subtitle">Centralized access to my applications and research services.<br>
      Welcome to my Kubernetes environment.</p>
      <div class="hero-line"></div>
    </header>

    <div class="section-head">
      <h2>APPLICATION SERVICES</h2>
      <span>SELECT A SERVICE TO CONTINUE&nbsp; / &nbsp;04 SERVICES</span>
    </div>

    <main class="grid">
    <a class="card about" href="/about/">
      <div class="icon-box">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="7" r="3"/><path d="M5 21v-2a7 7 0 0 1 14 0v2z"/><path d="M8 21v-2m8 2v-2"/></svg>
      </div>
      <div class="info">
        <h3>About Me</h3>
        <p>Student profile and personal information</p>
        <span class="path">/about</span>
      </div>
      <span class="arrow">↗</span>
    </a>

    <a class="card research" href="/research">
      <div class="icon-box">
        <svg viewBox="0 0 24 24"><path d="M5 3h14v18H5z"/><path d="M8 7h8M8 11h8M8 15h8M8 19h5"/></svg>
      </div>
      <div class="info">
        <h3>Research</h3>
        <p>Seminar research and project overview</p>
        <span class="path">/research</span>
      </div>
      <span class="arrow">↗</span>
    </a>

    <a class="card api" href="/api/Hello-Kubernetes">
      <div class="icon-box">
        <svg viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3m13-5h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3m13 5h3a2 2 0 0 0 2-2v-3M3 12h18M12 3v18"/></svg>
      </div>
      <div class="info">
        <h3>API Service</h3>
        <p>Send a message and display the response</p>
        <span class="path">/api/{message}</span>
      </div>
      <span class="arrow">↗</span>
    </a>

    <a class="card admin" href="http://admin.id-589.com/edit">
      <div class="icon-box">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="m19.4 15 .1.1 1.4 1.1-1.5 2.6-1.7-.7a8 8 0 0 1-1.7 1l-.3 1.9h-3l-.3-1.9a8 8 0 0 1-1.7-1l-1.7.7-1.5-2.6 1.4-1.1a8 8 0 0 1 0-2l-1.4-1.1 1.5-2.6 1.7.7a8 8 0 0 1 1.7-1l.3-1.9h3l.3 1.9a8 8 0 0 1 1.7 1l1.7-.7 1.5 2.6-1.4 1.1a8 8 0 0 1 0 2z"/></svg>
      </div>
      <div class="info">
        <h3>Admin Portal</h3>
        <p>Edit and save research content</p>
        <span class="path">admin.id-589.com/edit</span>
      </div>
      <span class="arrow">↗</span>
    </a>
    </main>

    <footer class="bottom-info">
      <span><strong>Panyapat Sungrung</strong> &nbsp;·&nbsp; Computer Engineering</span>
      <span>STUDENT ID 68130589 &nbsp; / &nbsp; KUBERNETES PLATFORM</span>
    </footer>
    </div>
    </body>
    </html>
