apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-api
  namespace: id-589
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app-api
  template:
    metadata:
      labels:
        app: app-api
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-worker1
      containers:
        - name: app-api
          image: localhost/app-api:589
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: svc-api
  namespace: id-589
spec:
  type: ClusterIP
  selector:
    app: app-api
  ports:
    - port: 80
      targetPort: 5000
      protocol: TCP
