
upstream k8s_backend {
    server 192.168.190.136:31080 max_fails=3 fail_timeout=10s;
    server 192.168.190.137:31080 max_fails=3 fail_timeout=10s;
}

server {
    listen 80;
    listen [::]:80;

    server_name www.id-589.com admin.id-589.com;

    access_log /var/log/nginx/k8s-lb-access.log;
    error_log /var/log/nginx/k8s-lb-error.log;

    location / {
        proxy_pass http://k8s_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
    }
}

